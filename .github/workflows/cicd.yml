name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch: null
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Update Rust toolchain
      run: rustup update
    - name: Run tests
      run: cargo test
    - name: Run clippy
      run: cargo clippy
    - name: Run fmt
      run: cargo fmt
